name: android-build

on:
  # main is owned by release.yml: when semantic-release (dry run) says the
  # commits warrant a release, it calls this workflow (workflow_call) to test
  # and build that commit as the coming version, before anything is tagged.
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the triggering ref)"
        required: false
        type: string
        default: ""
      version_name:
        description: "versionName to build, stamped in with scripts/set_version.sh; defaults to appVersionName in app/build.gradle.kts"
        required: false
        type: string
        default: ""
      version_code:
        description: "versionCode to build; defaults to scripts/version_code.sh for releases"
        required: false
        type: string
        default: ""
      release:
        description: "Build for a release: requires version_name, and signs the APK"
        required: false
        type: boolean
        default: false
    outputs:
      version_name:
        description: "The versionName that was built"
        value: ${{ jobs.build.outputs.version_name }}
      sherpa_artifact:
        description: "Name of the artifact holding the wake word library, for cleanup"
        value: ${{ jobs.sherpa.outputs.artifact }}

permissions:
  contents: read

# A new push to a pull request makes the in-flight build obsolete, so cancel it.
# Every other run (dispatch, workflow_call from release.yml) gets its own group.
concurrency:
  group: android-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The wake word's native library, built from source without text-to-speech
  # (so without espeak-ng) and cached; see sherpa-build.yml.
  sherpa:
    uses: ./.github/workflows/sherpa-build.yml
    with:
      ref: ${{ inputs.ref }}
      retention-days: ${{ inputs.release && 30 || 3 }}

  build:
    runs-on: ubuntu-latest
    # A hung step must not run to the 6 hour default and burn Actions minutes.
    timeout-minutes: 20
    needs: sherpa
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    env:
      IS_RELEASE: ${{ inputs.release == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 defaults to a closed-source caching provider that is only a free
          # preview for private repositories; basic is the MIT-licensed one
          # built on actions/cache. Runs on main (the release build) write the
          # cache; pull requests only read it.
          #
          # No configuration cache: app/build.gradle.kts reads the signing
          # passwords at configuration time, so its cache entry would hold them,
          # and saved to the Actions cache it would be readable from PR runs.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Read versionName
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="${INPUT_VERSION_NAME#v}"
          else
            VERSION_NAME=$(grep -oP 'appVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      # A release is built from the commit semantic-release is about to tag, before
      # its version commit exists, so the version goes in here the same way
      # semantic-release's prepare step puts it in (app/build.gradle.kts, README).
      - name: Stamp the release version
        if: env.IS_RELEASE == 'true'
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$INPUT_VERSION_NAME" ]; then
            echo "::error::a release build needs version_name"
            exit 1
          fi
          scripts/set_version.sh "$VERSION_NAME"

      # versionCode must only ever go up for in-place upgrades, so a release
      # derives it from the versionName (scripts/version_code.sh). Throwaway PR
      # and dispatch builds use the run number, which stays far below any
      # release code, so a release APK always upgrades over them.
      - name: Resolve versionCode
        id: code
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ -n "$INPUT_VERSION_CODE" ]; then
            CODE="$INPUT_VERSION_CODE"
          elif [ "$IS_RELEASE" = "true" ]; then
            CODE=$(scripts/version_code.sh "$VERSION_NAME")
          else
            CODE="$GITHUB_RUN_NUMBER"
          fi
          echo "Building ${VERSION_NAME} as versionCode ${CODE}"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      # Only releases are signed. PR builds stay unsigned so no signing secret
      # is ever exposed to pull-request code.
      - name: Decode signing keystore
        if: env.IS_RELEASE == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set; a release APK must be signed."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Download wake word library
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sherpa.outputs.artifact }}
          path: ${{ runner.temp }}/sherpa

      # The keyword-spotting model is pinned and checksummed by the script, and
      # too big to commit. Cached on the script's hash, so a version bump
      # fetches fresh files.
      - name: Cache wake word model
        uses: actions/cache@v6
        with:
          path: app/src/main/assets/wake/model
          key: wake-word-model-${{ hashFiles('scripts/fetch_sherpa.sh') }}

      # Installs the model and the library downloaded above (SHERPA_LIB), and
      # refuses a library that contains espeak-ng or is not 16 KB aligned.
      - name: Install wake word files
        env:
          SHERPA_LIB: ${{ runner.temp }}/sherpa/libsherpa-onnx-jni.so
        run: scripts/fetch_sherpa.sh

      - name: Test and build APK
        env:
          KEYSTORE_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ env.IS_RELEASE == 'true' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.KEY_PASSWORD || '' }}
        run: ./gradlew testReleaseUnitTest assembleRelease -PversionCode=${{ steps.code.outputs.code }}

      - name: Stage APK
        run: |
          mkdir -p dist
          APK_SOURCE=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          if [ "$IS_RELEASE" = "true" ] && [ "$APK_SOURCE" != "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::release build produced an unsigned APK"
            exit 1
          fi
          cp "$APK_SOURCE" "dist/voice-relay-v${{ steps.version.outputs.name }}.apk"
          # The license notices travel with the APK on the release page too.
          cp NOTICE THIRD_PARTY_NOTICES.md dist/

      # What ships: the library in the APK must be the self-built one.
      - name: Check the APK's wake word library
        run: |
          APK="dist/voice-relay-v${{ steps.version.outputs.name }}.apk"
          unzip -l "$APK" 'lib/*'
          unzip -o -q "$APK" lib/arm64-v8a/libsherpa-onnx-jni.so -d "$RUNNER_TEMP/apk"
          if grep -a -q -E '(^|[^w])espeak' "$RUNNER_TEMP/apk/lib/arm64-v8a/libsherpa-onnx-jni.so"; then
            echo "::error::the APK's libsherpa-onnx-jni.so contains espeak-ng"
            exit 1
          fi
          echo "APK $(wc -c < "$APK") bytes, libsherpa-onnx-jni.so $(wc -c < "$RUNNER_TEMP/apk/lib/arm64-v8a/libsherpa-onnx-jni.so") bytes, no espeak-ng" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: voice-relay-v${{ steps.version.outputs.name }}
          path: dist/*
          # Artifacts count against the account's Actions storage quota.
          # Releases keep their APK on the GitHub release (release assets do
          # not count), and release.yml's attach job deletes this copy once the
          # APK is attached, so the short retention only matters for PR builds.
          retention-days: 3

