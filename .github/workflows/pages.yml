name: pages

# Publishes docs/ (the architecture page) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub Pages only serves public repos on this plan, so while the repo is private
  # this job stands in for the deploy and passes with a note.
  private-repo:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    # A hung step must not run to the 6 hour default and burn Actions minutes.
    timeout-minutes: 5
    steps:
      - run: echo "::notice::Pages is skipped while the repository is private; it deploys once the repository is public."

  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # A hung step must not run to the 6 hour default and burn Actions minutes.
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
